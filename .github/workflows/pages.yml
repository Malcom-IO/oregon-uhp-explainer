name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # The published address, so the PDF's links and notes point at this site
      # (a fork gets its own). Pull requests from forks cannot read it; the PDF
      # is then built with relative links, which still checks that it renders.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - run: npm run pdf
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
          # What gets published must point at the published site.
          REQUIRE_PUBLIC_URL: ${{ github.ref == 'refs/heads/main' }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
