name: Something else about the project
description: A bug in the page or calculator, embedding or reusing it, or a question about the code.
body:
  - type: markdown
    attributes:
      value: >-
        Issues here go to this project, not to the Board. To tell the Board what it should decide,
        use its [public comment process](https://www.oregon.gov/uhpgb/Pages/public-comment.aspx).
  - type: textarea
    id: details
    attributes:
      label: What's on your mind?
      description: For a bug, say what you did, what you expected and what happened, and which browser you used.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is about the project, not a recommendation about what the Board should decide.
          required: true
